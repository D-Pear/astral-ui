name: Release

on:
    push:
        tags:
            - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            RELEASE_TAG: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4
            - name: 检查版本标签
              shell: bash
              run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: 打包
              run: zip -r "astral-ui-${RELEASE_TAG}.zip" dist
            - name: 发布
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  archive="astral-ui-${RELEASE_TAG}.zip"
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" "$archive" --clobber
                  else
                      gh release create "$RELEASE_TAG" "$archive" --title "$RELEASE_TAG" --generate-notes --verify-tag
                  fi
